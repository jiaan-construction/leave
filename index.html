<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>JIA AN｜司机调度中心</title>
<style>
/* 沿用工地导航的 JIA AN 视觉规范：品牌红只用于动作与标识 */
:root{--brand:#E9272C;--ground:#F6F7F9;--surface:#fff;--surface-2:#F1F3F6;--ink:#111;--ink-soft:#5E6367;--ink-faint:#8C9296;
--rule:#E1E4E8;--rule-soft:#EDEFF2;--settled:#2E3438;--settled-bg:#ECEEF0;--pending:#B4620F;--pending-bg:#FBEEDF;
--shadow:0 1px 2px rgba(17,17,17,.05),0 4px 14px rgba(17,17,17,.05);
--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--brand:#FF5054;--ground:#111214;--surface:#1A1C1F;--surface-2:#212429;--ink:#EDEEEF;--ink-soft:#A0A6AA;--ink-faint:#767C81;--rule:#2A2E33;--rule-soft:#22262A;--settled:#C3CACE;--settled-bg:#262A2E;--pending:#E0953F;--pending-bg:#2E2415}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.47 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(105px + env(safe-area-inset-bottom,0px))}
.masthead{display:flex;align-items:center;gap:14px;padding:14px 0 6px}
.masthead img{width:38px;height:38px;flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin:0 0 4px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{margin:6px 0 0;font-size:15px;color:var(--ink-soft);padding-top:8px;border-top:2px solid var(--brand)}
.sub p{margin:0}
.sub b{color:var(--ink)}
.controls{position:sticky;top:0;z-index:5;background:var(--ground);padding:11px 0 12px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:8px}
.controls:not(:has(> :not([hidden]))){display:none}
.filters{display:flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--rule);border-radius:11px}
.chip{flex:1;min-height:44px;font:600 15px var(--sans);color:var(--ink-soft);background:transparent;border:0;border-radius:9px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.14)}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
h2 span{font-size:14px;font-weight:400;color:var(--ink-faint)}
.card{display:flex;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.card:before{content:"";width:6px;flex:none;background:var(--settled)}
.card.gap:before{background:var(--brand)}
.body{flex:1;min-width:0;padding:12px 14px}
.where{font-size:19px;font-weight:700}
.who{color:var(--ink-soft);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;margin-left:6px;background:var(--pending-bg);color:var(--pending)}
.state{margin-top:6px;font-weight:600}
.gap .state{color:var(--brand)}
.act{flex:none;width:84px;border:0;border-left:1px solid var(--rule-soft);background:transparent;color:var(--brand);font:600 14px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:6px}
.gate{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:600 17px var(--sans);cursor:pointer}
.msg{color:var(--brand);min-height:1.4em;margin:0}
.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;border-top:1px solid var(--rule);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-inner{max-width:760px;margin:auto;padding:4px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs .chip{position:relative;font-size:13px;padding:5px 2px 6px;min-height:56px}
.tabs .chip[aria-pressed=true]{box-shadow:none;color:var(--brand);background:var(--surface-2)}
.tab-en{display:block;font-size:10px;font-weight:500;line-height:1.2;margin-bottom:4px}
.badge{display:inline-block;min-width:15px;padding:0 3px;margin-left:3px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;line-height:15px;vertical-align:1px}
.updated{white-space:nowrap;color:var(--ink-soft)}
.daybar{display:flex;align-items:center;gap:8px}
.daybar button{width:52px;height:44px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);color:var(--ink);font:600 20px var(--sans);cursor:pointer}
.daybar button:disabled{opacity:.3}
.daybar strong{flex:1;text-align:center}
.site{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.site h3{margin:0;padding:10px 14px;font-size:17px;display:flex;justify-content:space-between;gap:8px;background:var(--surface-2)}
.site h3 span{font-size:13px;font-weight:400;color:var(--ink-faint)}
.slot{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-top:1px solid var(--rule-soft)}
.tc{flex:none;width:76px;font-weight:600;font-size:15px}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.visible-note{margin:4px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.35;overflow-wrap:anywhere}.visible-note:before{content:"备注";font-size:11px;font-weight:600;margin-right:6px;color:var(--pending)}
.st{flex:none;font-size:13px;color:var(--ink-faint)}
.slot.gap{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.slot.gap .st{color:var(--brand);font-weight:700}
.slot.open .st,.slot.cover .st{color:var(--pending);font-weight:600}
.slot.rest .nm,.slot.none .nm{color:var(--ink-faint)}
.empty,.foot{color:var(--ink-faint);font-size:14px;text-align:center;margin-top:24px}
.toast{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);border-radius:12px;padding:12px 14px;font-size:15px;text-align:center}
.action{display:inline-flex;align-items:center;min-height:44px;padding:4px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--brand);font:600 14px var(--sans);text-decoration:none;cursor:pointer}
.person{padding:14px;margin-top:10px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.person p strong{display:block;color:var(--ink);font-weight:600}.relief-group>h2{margin:20px 0 8px}#operatorTitle{margin:0;padding:0;border:0}.person h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.person p,.hint{margin:6px 0;font-size:14px;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chiptype{display:inline-block;font-size:12px;font-weight:600;line-height:18px;padding:0 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink);white-space:nowrap}
.chiptype.unknown{color:var(--ink-faint);font-weight:400}
.slot{align-items:center}
.tc{width:84px}.tc .chiptype{display:block;width:max-content;margin-top:2px}
.nm summary{list-style:none;cursor:pointer;font-weight:600}.nm summary::-webkit-details-marker{display:none}
.nm summary small{color:var(--ink-faint);font-weight:400;margin-left:6px}
.detail{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:4px}
.call{flex:none;min-width:48px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--brand);font:600 14px var(--sans);text-decoration:none}
.contact-actions{display:inline-flex;gap:5px;flex:0 0 auto}
.contact-actions .call{padding:0 7px;font-size:12px}
.slot .contact-actions{flex-direction:column;align-items:stretch}
.relief-heading{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.person .line{align-items:flex-start}
.who{color:var(--ink)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.line .state{margin:0}
.need{margin-top:3px;font-size:14px;color:var(--ink-soft)}
.coverage-day{margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:15px;background:var(--surface-2)}
.coverage-day h2{margin:0 0 10px;color:var(--ink);border-color:var(--rule)}
.coverage-day h3{font-size:15px;margin:10px 0 6px}
.coverage-day .site h4{margin:0;padding:10px 14px;font-size:15px;background:var(--surface-2)}
.coverage-day .empty{margin:10px 0;text-align:left}
.coverage-day .card:last-child{margin-bottom:0}
.coverage-day{scroll-margin-top:78px}
.coverage-jump{display:flex;align-items:center;gap:6px}
.coverage-jump button{flex:0 0 auto}
.date-choice{display:flex;align-items:center;gap:6px;min-width:0;margin-left:auto;font-size:13px}
.date-choice input{max-width:100%;min-width:0;min-height:44px;padding:4px 6px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit}
.coverage-slot .action,.coverage-card .action{white-space:nowrap}
.coverage-card .who{font-weight:600;font-size:16px}
.leave-person .line{margin:0;align-items:start}
.leave-dates small{display:block;color:var(--ink-soft);font-size:13px}
.leave-calendar{margin:10px 0 14px;padding:10px;border:1px solid var(--rule);border-radius:14px;background:var(--surface)}
.calendar-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.calendar-head strong{text-align:center;font-size:16px}
.calendar-head .action{justify-content:center;padding:4px 9px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:1px}
.calendar-weekday{padding:4px 0;color:var(--ink-soft);font-size:12px}
.calendar-day{display:grid;place-items:center;min-height:38px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--ink);font:600 15px var(--sans)}
.calendar-day[disabled]{color:var(--ink-faint);font-weight:400}
.calendar-day.has-leave{color:var(--brand);cursor:pointer}
.calendar-day[aria-pressed=true]{color:#fff;background:#C91B26}
.calendar-day[aria-current=date]:not([aria-pressed=true]){outline:1px solid var(--rule);outline-offset:-2px}
.calendar-selection{margin:6px 2px 0;color:var(--ink-soft);font-size:13px}
.leave-full{margin:3px 0 0!important}
.site-heading{align-items:center}
.site-heading .site-tools{display:flex;align-items:center;gap:7px;flex:none}
.site-heading .site-tools>span{white-space:nowrap}
.site-heading .nav-link{min-height:40px;width:42px;justify-content:center}
.nav-arrow{display:block;transform:rotate(-36deg);font-size:21px!important;color:var(--brand)!important}
.leave-item{border-top:1px solid var(--rule-soft);margin-top:9px;padding-top:8px}
.leave-item p{margin:3px 0;font-size:14px}
.leave-item .tag{margin-left:5px}
</style>
</head>

<div class="toast" id="toast" hidden></div>
<script>
(function(){
const $ = id => document.getElementById(id);
const KEY = 'jiaan-leave-key';
const store = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}}, set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let data = null;

async function open(pass){
  const pack = await (await fetch('data.json?t=' + Date.now(), {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:bytes(pack.salt), iterations:pack.iter}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(pack.iv)}, key, bytes(pack.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function el(tag, cls, text){const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n;}
const sg = () => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Singapore'}).format(new Date());
const plus = (iso,n) => {const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);};
function dayName(iso){
  const d = new Date(iso+'T00:00:00Z'), t = sg();
  const head = iso===t ? '今天 ' : iso===plus(t,1) ? '明天 ' : '';
  const year = iso.slice(0,4)!==t.slice(0,4) ? iso.slice(0,4)+'年' : '';
  return `${head}${year}${d.getUTCMonth()+1}月${d.getUTCDate()}日 周${'日一二三四五六'[d.getUTCDay()]}`;
}
let toastTimer;
function toast(t){$('toast').textContent=t; $('toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').hidden=true, 3500);}
async function report(r){
  if(!r.tc || r.site === '工地待核'){ toast('请先核对工地和塔吊号'); return; }
  const site = r.site.replace(/（[^）]+）$/, '');
  const date = new Intl.DateTimeFormat('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC'})
    .format(new Date(r.date+'T00:00:00Z'));
  const shift = {'上午':' for the morning shift', '下午':' for the afternoon shift', '白':' for the day shift',
                 '日':' for the day shift', '夜':' for the night shift'}[r.part || r.shift] ||
    (/^\d{1,2}:\d{2}–\d{1,2}:\d{2}$/.test(r.part || '') ? ' from ' + r.part.replace('–',' to ') : '');
  const crane = r.tc ? ' (tower crane ' + r.tc + ')' : '';
  const text = `Hi, could you help cover a tower crane shift at ${site}${crane} on ${date}${shift}? Please let me know if you're available. Thank you!`;
  try{ await navigator.clipboard.writeText(text); toast('英文邀班已复制'); }
  catch(e){ prompt('复制英文邀班', text); }
}
function action(label, run){
  const b = el('button','action',label); b.type = 'button'; b.onclick = run; return b;
}
function chip(text){ return el('span', 'chiptype' + (text.includes('待核') ? ' unknown' : ''), text); }
function whatsappLink(phone, label='WhatsApp', message=''){
  const link = el('a','call',label);
  const url = new URL('https://wa.me/' + phone.replace(/\D/g,''));
  if(message) url.searchParams.set('text',message);
  link.href = url.href;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  return link;
}
function contacts(phone, name){
  const group = el('div','contact-actions');
  const call = el('a','call','Call');
  call.href = 'tel:' + phone.replace(/[^\d+]/g,'');
  const whatsapp = whatsappLink(phone);
  if(name){
    call.setAttribute('aria-label','Call ' + name);
    whatsapp.setAttribute('aria-label','WhatsApp ' + name);
  }
  group.append(call, whatsapp);
  return group;
}
const info = name => (data.people || {})[name] || {full:'', types:[], certificates:[]};
const pretty = phone => phone.replace(/^\+65(\d{4})(\d{4})$/, '+65 $1 $2');
function details(name, phone, note){
  const p = info(name), d = el('details'), s = el('summary','',name);
  if(note) s.append(el('small','',note));
  d.append(s);
  const lines = [p.full && '全名：' + p.full, phone && '手机：' + pretty(phone),
                 p.types.length ? '能开：' + p.types.join('、') : '能开机型：未登记', ...p.certificates];
  for(const line of lines.filter(Boolean)) d.append(el('div','detail',line));
  return d;
}
function coverageCard(r){
  const c = el('div','card gap coverage-card'), b = el('div','body');
  const who = el('div','who', `${r.who} 休假${r.part ? '（'+r.part+'）' : ''}`);
  if(r.pending) who.append(el('span','tag','请假待确认'));
  const site = el('div','need',`${r.site} · ${r.tc || '塔吊待核'} `);
  site.append(chip(r.crane));
  b.append(who, site, coverageActions(r));
  c.append(b);
  return c;
}
function coverageActions(row){
  const actions = el('div','actions');
  actions.append(action('找人', () => findRelief(row.crane)), action('复制英文邀班', () => report(row)));
  return actions;
}
function findRelief(crane){
  const machine = crane.startsWith('平桥') ? '平桥' : crane.startsWith('上下桥') ? '上下桥' : '';
  switchTab('operators', machine, machine ? '' : '该机位机型待核，以下为全部替班司机。');
}
const LABEL = {ok:'', cover:'顶班', gap:'待替班', open:'没排人', rest:'休', none:'无人'};
const TABS = {tToday:'today', tGap:'gap', tLeave:'leave', tOperators:'operators'};
let tab = 'today', past = false, dayAt = null, kind = '', reliefHint = '', coverageDate = '';
let leaveMonth = '', leaveDate = '';
function switchTab(next, machine='', hint=''){
  tab = next;
  dayAt = null;
  kind = machine;
  reliefHint = hint;
  window.scrollTo(0, 0);
  draw();
}
function drawOperators(list){
  if(reliefHint) list.append(el('p','hint',reliefHint));
  const found = data.operators || [];
  const order = (a,b) => (!!b.phone - !!a.phone) || (b.types.length - a.types.length) || a.name.localeCompare(b.name);
  const sure = found.filter(p => !kind || p.types.includes(kind)).sort(order);
  const unsure = kind ? found.filter(p => !p.types.length).sort(order) : [];
  const people = [...sure, ...unsure];
  if(kind && !sure.length) list.append(el('p','empty', `没有登记能开${kind}的替班司机。`));
  for(const p of people){
    if(kind && p === unsure[0]) list.append(el('h2','','机型待确认'));
    const box = el('article','person'), line = el('div','line');
    const heading = el('div','relief-heading');
    heading.append(el('h3','',p.name));
    const labels = {'平桥':'Saddle Jib','上下桥':'Luffing Jib'};
    for(const kind of p.types) if(labels[kind]) heading.append(chip(labels[kind]));
    line.append(heading);
    if(p.phone) line.append(whatsappLink(p.phone));
    box.append(line);
    for(const x of [p.note, p.area && '居住位置：' + p.area, p.phone && '手机：' + pretty(p.phone)].filter(Boolean))
      box.append(el('div','detail',x));
    list.append(box);
  }
  if(!people.length && !kind) list.append(el('p','empty', '暂无替班司机记录。'));
}
function dateRanges(dates){
  const ranges = [];
  for(const date of [...new Set(dates)].sort()){
    const last = ranges.at(-1);
    if(last && plus(last[1],1) === date) last[1] = date;
    else ranges.push([date,date]);
  }
  return ranges;
}
function compactDate(iso){
  const [year,month,day] = iso.split('-').map(Number);
  return `${year!==Number(sg().slice(0,4)) ? year+'年' : ''}${month}月${day}日`;
}
function leaveDateText(days, part=''){
  const ranges = part ? [...new Set(days)].sort().map(day => [day,day]) : dateRanges(days);
  let previousMonth = '';
  return ranges.map(([start,end]) => {
    const month = start.slice(0,7), endingMonth = end.slice(0,7);
    const startDay = Number(start.slice(-2)), endDay = Number(end.slice(-2));
    const startText = month === previousMonth ? startDay + '日' : compactDate(start);
    previousMonth = endingMonth;
    if(start === end) return startText + (part ? '（' + part + '）' : '');
    if(month === endingMonth) return startText.slice(0,-1) + '–' + endDay + '日';
    return startText + '–' + compactDate(end);
  }).join('、');
}
function changeLeaveMonth(step){
  const date = new Date((leaveMonth || sg().slice(0,7))+'-01T00:00:00Z');
  date.setUTCMonth(date.getUTCMonth()+step);
  leaveMonth = date.toISOString().slice(0,7);
  leaveDate = '';
  draw();
}
function drawLeaveCalendar(rows){
  const calendar = $('leaveCalendar');
  const today = sg();
  const month = leaveMonth || today.slice(0,7);
  const first = new Date(month+'-01T00:00:00Z');
  const days = new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
  const prev=action('‹',()=>changeLeaveMonth(-1)), next=action('›',()=>changeLeaveMonth(1));
  prev.setAttribute('aria-label','上个月');
  next.setAttribute('aria-label','下个月');
  const home=action('今天',()=>{leaveMonth=today.slice(0,7); leaveDate=''; draw();});
  const head=el('div','calendar-head');
  head.append(prev,el('strong','',`${first.getUTCFullYear()}年${first.getUTCMonth()+1}月`),next,home);
  const grid=el('div','calendar-grid');
  for(const weekday of '一二三四五六日') grid.append(el('span','calendar-weekday',weekday));
  for(let blank=0; blank<(first.getUTCDay()+6)%7; blank++) grid.append(el('span'));
  const marked=new Set(rows.map(row=>row.date));
  for(let day=1;day<=days;day++){
    const iso=month+'-'+String(day).padStart(2,'0'), active=marked.has(iso);
    const button=action(String(day),()=>{leaveDate=leaveDate===iso ? '' : iso; draw();});
    button.className='calendar-day' + (active ? ' has-leave' : '');
    button.disabled=!active;
    button.setAttribute('aria-label',compactDate(iso)+(active ? '，有休假记录' : '，无休假记录'));
    button.setAttribute('aria-pressed',String(leaveDate===iso));
    if(today===iso) button.setAttribute('aria-current','date');
    grid.append(button);
  }
  const selection=el('p','calendar-selection',leaveDate ? compactDate(leaveDate) + ' · 再点日期查看全部' : '红色日期有休假 · 当前显示全部');
  selection.setAttribute('aria-live','polite');
  calendar.replaceChildren(head,grid,selection);
}
function drawLeave(list, rows){
  const people = new Map();
  for(const r of rows){
    const person = r.person_group || JSON.stringify([r.who,r.site,r.tc]);
    if(!people.has(person)) people.set(person, {name:r.who, phones:new Set(), slots:new Map()});
    const entry = people.get(person);
    if(r.who_phone) entry.phones.add(r.who_phone);
    const slot = JSON.stringify([r.site,r.tc]);
    if(!entry.slots.has(slot)) entry.slots.set(slot, {site:r.site,tc:r.tc,dates:new Map()});
    const dates = entry.slots.get(slot).dates;
    const status = JSON.stringify([r.part || '',!!r.pending,r.rep || '']);
    if(!dates.has(status)) dates.set(status,{r,dates:[]});
    dates.get(status).dates.push(r.date);
  }
  for(const {name,phones,slots} of people.values()){
    const box = el('article','person leave-person');
    const header = el('div','line');
    const heading=el('div');
    heading.append(el('h3','',name));
    if(info(name).full) heading.append(el('p','leave-full',info(name).full));
    header.append(heading);
    if(!past && phones.size === 1){
      header.append(whatsappLink([...phones][0],'WhatsApp 确认休假',
        'Hi, could you please confirm whether your upcoming leave dates are still the same? Thank you.'));
    }
    box.append(header);
    for(const {site,tc,dates} of slots.values()){
      const item = el('div','leave-item');
      item.append(el('strong','',site + ' · ' + (tc || '塔吊待核')));
      for(const {r,dates:days} of dates.values()){
        const line = el('p','leave-dates',leaveDateText(days,r.part));
        if(r.pending) line.append(el('span','tag','请假待确认'));
        if(r.rep) line.append(el('small','',r.rep+' 顶班'));
        item.append(line);
      }
      box.append(item);
    }
    list.append(box);
  }
  if(!people.size) list.append(el('p','empty','没有休假记录。'));
}
function drawCoverage(list, dates, gaps){
  for(const date of dates){
    const leave = gaps.filter(r => r.date === date);
    const open = openSlots(date);
    const block = el('section','coverage-day');
    block.id = 'coverage-' + date;
    block.append(el('h2','',dayName(date)));
    if(leave.length){
      block.append(el('h3','',`待替班 ${leave.length}`));
      for(const row of leave) block.append(coverageCard(row));
    }
    if(open.length){
      block.append(el('h3','',`没排人 ${open.length}`));
      for(const site of new Set(open.map(x => x.site))){
        const box = el('section','site');
        box.append(el('h4','',site));
        for(const row of open.filter(x => x.site === site)){
          const slot = el('div','slot open coverage-slot');
          const content = el('div','nm',`${row.tc}${row.shift ? ' ' + row.shift : ''} `);
          content.append(chip(row.crane));
          slot.append(content,coverageActions({...row,date}));
          box.append(slot);
        }
        block.append(box);
      }
    }
    if(!leave.length && !open.length) block.append(el('p','empty','暂无待替班或未排岗位。'));
    list.append(block);
  }
}
function navigationLink(site){
  const link = el('a','action nav-link');
  const icon = el('span','nav-arrow','➤');
  icon.setAttribute('aria-hidden','true');
  link.append(icon);
  const url = new URL('https://maps.apple.com/directions');
  url.searchParams.set('destination',site.navigation);
  link.href = url.href;
  link.rel = 'noopener noreferrer';
  const destination = site.navigation.startsWith('Jurong Island Checkpoint') ? '裕廊岛入口' : site.site;
  link.setAttribute('aria-label', '用 Apple Maps 导航到' + destination);
  link.title = '导航到' + destination;
  return link;
}
function slotRow(x){
  const row = el('div','slot ' + x.state), tc = el('div','tc', `${x.tc}${x.shift ? ' '+x.shift : ''}`);
  tc.append(chip(x.crane));
  const nm = el('div','nm');
  if(x.name) nm.append(details(x.name, x.phone, x.note));
  else nm.textContent = x.state==='none' ? '—' : x.state==='open' ? '？' : '';
  row.append(tc, nm);
  if(LABEL[x.state]) row.append(el('span','st', LABEL[x.state]));
  if(x.phone && (x.state==='ok' || x.state==='cover')) row.append(contacts(x.phone, x.name));
  return row;
}
function openSlots(day){
  const d = data.schedule.find(x => x.date === day);
  return d ? d.sites.flatMap(s => s.slots.filter(x => x.state==='open').map(x => ({site:s.site, ...x}))) : [];
}
function drawToday(list){
  const days = data.schedule.filter(d => d.date >= sg());
  if(!days.length){ list.append(el('p','empty','今天以后还没有排班记录。')); $('day').textContent=''; return; }
  let i = days.findIndex(d => d.date === dayAt); if(i < 0) i = 0;
  const d = days[i]; dayAt = d.date;
  $('day').textContent = dayName(d.date);
  $('prev').disabled = i === 0; $('next').disabled = i === days.length - 1;
  $('prev').onclick = () => { dayAt = days[i-1].date; draw(); };
  $('next').onclick = () => { dayAt = days[i+1].date; draw(); };
  if(d.date !== sg() && i === 0) list.append(el('p','empty','今天还没有排班记录，下面是最近的一天。'));
  let shown = 0;
  for(const s of d.sites){
    if(!s.slots.length) continue;
    shown++;
    const box = el('section','site'), h = el('h3','site-heading',s.site);
    const tools = el('span','site-tools'), n = s.slots.filter(x=>x.state==='gap').length;
    if(s.rest || n) tools.append(el('span','', s.rest ? '工地休' : `待替班 ${n}`));
    if(s.navigation) tools.append(navigationLink(s));
    else tools.append(el('span','','位置待核'));
    h.append(tools);
    box.append(h);
    for(const x of s.slots) box.append(slotRow(x));
    list.append(box);
  }
  if(!shown) list.append(el('p','empty','没找到。'));
}
function draw(){
  const today = sg();
  const tomorrow = plus(today,1);
  const future = data.rows.filter(r => r.date >= today);
  const gapRows = future.filter(r => !r.rep);
  const urgent = gapRows.filter(r => r.date <= tomorrow).length;
  $('sub').replaceChildren(el('span','updated', `更新于 ${data.updated}`));
  $('nGap').textContent = urgent;
  $('nGap').hidden = !urgent;
  for(const [id,name] of Object.entries(TABS)) $(id).setAttribute('aria-pressed', tab===name);
  $('daybar').hidden = tab !== 'today'; $('when').hidden = tab !== 'leave';
  $('leaveCalendar').hidden = tab !== 'leave';
  $('coverageJump').hidden = tab !== 'gap';
  $('kind').hidden = tab !== 'operators';
  for(const [id,value] of [['kAll',''],['kFlat','平桥'],['kLuff','上下桥']]) $(id).setAttribute('aria-pressed', kind===value);
  $('wNext').setAttribute('aria-pressed', !past); $('wPast').setAttribute('aria-pressed', past);
  $('foot').hidden = false;
  $('foot').textContent = tab === 'operators' ? '派工前请核对证件类别及有效期。' : '这是计划排班。机型带「推定」的，派工前先确认。';
  const list = $('list'); list.replaceChildren();
  if(tab === 'today'){ drawToday(list); return; }
  if(tab === 'operators'){ drawOperators(list); return; }
  if(tab === 'gap'){
    const calendar = $('coverageDate');
    calendar.min = today;
    calendar.value = coverageDate >= today ? coverageDate : today;
    const unassignedDates = data.schedule.filter(d => d.date >= today &&
      d.sites.some(site => site.slots.some(slot => slot.state === 'open'))).map(d => d.date);
    const dates = new Set([today,tomorrow,calendar.value,...gapRows.map(row => row.date),...unassignedDates]);
    drawCoverage(list, [...dates].sort(), gapRows);
    return;
  }
  const records = past ? data.past.filter(r => r.date < today) : future;
  drawLeaveCalendar(records);
  drawLeave(list, leaveDate ? records.filter(r => r.date===leaveDate) : records);

}
function jumpCoverage(date){
  if(!date || date < sg()) return;
  coverageDate = date;
  draw();
  $(`coverage-${date}`)?.scrollIntoView({behavior:'smooth',block:'start'});
}
function key(){
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  return m ? m[1] : store.get();
}
async function load(){
  const k = key();
  if(!k){ $('sub').textContent = '请用群里发的完整链接打开。'; return; }
  try{ data = await open(k); }
  catch(e){ $('app').hidden = true; $('sub').textContent = e.name==='OperationError' ? '这个链接已经失效，请要一个新链接。' : '打不开，请检查网络后再试。'; return; }
  store.set(k); $('app').hidden = false; draw();
}
for(const [id,next] of Object.entries(TABS)) $(id).onclick = () => switchTab(next);
for(const [id,value] of [['kAll',''],['kFlat','平桥'],['kLuff','上下桥']]) $(id).onclick = () => { kind = value; draw(); };
$('jumpToday').onclick = () => jumpCoverage(sg());
$('jumpTomorrow').onclick = () => jumpCoverage(plus(sg(),1));
$('coverageDate').onchange = event => jumpCoverage(event.target.value);
$('wNext').onclick = () => { past = false; leaveDate = ''; leaveMonth = ''; draw(); };
$('wPast').onclick = () => { past = true; leaveDate = ''; leaveMonth = ''; draw(); };
window.addEventListener('hashchange', load);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
load();
})();
</script>
