<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<title>JIA AN｜司机调度中心</title>
<style>
/* 沿用工地导航的 JIA AN 视觉规范：品牌红只用于动作与标识 */
:root{--brand:#E9272C;--ground:#F6F7F9;--surface:#fff;--surface-2:#F1F3F6;--ink:#111;--ink-soft:#5E6367;--ink-faint:#8C9296;
--rule:#E1E4E8;--rule-soft:#EDEFF2;--settled:#2E3438;--settled-bg:#ECEEF0;--pending:#B4620F;--pending-bg:#FBEEDF;
--shadow:0 1px 2px rgba(17,17,17,.05),0 4px 14px rgba(17,17,17,.05);
--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--brand:#FF5054;--ground:#111214;--surface:#1A1C1F;--surface-2:#212429;--ink:#EDEEEF;--ink-soft:#A0A6AA;--ink-faint:#767C81;--rule:#2A2E33;--rule-soft:#22262A;--settled:#C3CACE;--settled-bg:#262A2E;--pending:#E0953F;--pending-bg:#2E2415}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.47 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(105px + env(safe-area-inset-bottom,0px))}
.masthead{display:flex;align-items:center;gap:14px;padding:14px 0 6px}
.masthead img{width:38px;height:38px;flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin:0 0 4px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{margin:6px 0 0;font-size:15px;color:var(--ink-soft);padding-top:8px;border-top:2px solid var(--brand)}
.sub p{margin:0}
.sub b{color:var(--ink)}
.controls{position:sticky;top:0;z-index:5;background:var(--ground);padding:11px 0 12px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:8px}
input[type=search],input[type=password]{width:100%;height:52px;padding:0 16px;font:400 17px/1 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:12px}
input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.filters{display:flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--rule);border-radius:11px}
.chip{flex:1;min-height:44px;font:600 15px var(--sans);color:var(--ink-soft);background:transparent;border:0;border-radius:9px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.14)}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
h2 span{font-size:14px;font-weight:400;color:var(--ink-faint)}
.card{display:flex;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.card:before{content:"";width:6px;flex:none;background:var(--settled)}
.card.gap:before{background:var(--brand)}
.body{flex:1;min-width:0;padding:12px 14px}
.where{font-size:19px;font-weight:700}
.who{color:var(--ink-soft);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;margin-left:6px;background:var(--pending-bg);color:var(--pending)}
.state{margin-top:6px;font-weight:600}
.gap .state{color:var(--brand)}
.act{flex:none;width:84px;border:0;border-left:1px solid var(--rule-soft);background:transparent;color:var(--brand);font:600 14px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:6px}
.gate{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:600 17px var(--sans);cursor:pointer}
.msg{color:var(--brand);min-height:1.4em;margin:0}
.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;border-top:1px solid var(--rule);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-inner{max-width:760px;margin:auto;padding:4px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs .chip{position:relative;font-size:13px;padding:5px 2px 6px;min-height:56px}
.tabs .chip[aria-pressed=true]{box-shadow:none;color:var(--brand);background:var(--surface-2)}
.tab-en{display:block;font-size:10px;font-weight:500;line-height:1.2;margin-bottom:4px}
.badge{display:inline-block;min-width:15px;padding:0 3px;margin-left:3px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;line-height:15px;vertical-align:1px}
.updated{white-space:nowrap;color:var(--ink-soft)}
.daybar{display:flex;align-items:center;gap:8px}
.daybar button{width:52px;height:44px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);color:var(--ink);font:600 20px var(--sans);cursor:pointer}
.daybar button:disabled{opacity:.3}
.daybar strong{flex:1;text-align:center}
.site{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.site h3{margin:0;padding:10px 14px;font-size:17px;display:flex;justify-content:space-between;gap:8px;background:var(--surface-2)}
.site h3 span{font-size:13px;font-weight:400;color:var(--ink-faint)}
.slot{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-top:1px solid var(--rule-soft)}
.tc{flex:none;width:76px;font-weight:600;font-size:15px}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.visible-note{margin:4px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.35;overflow-wrap:anywhere}.visible-note:before{content:"备注";font-size:11px;font-weight:600;margin-right:6px;color:var(--pending)}
.st{flex:none;font-size:13px;color:var(--ink-faint)}
.slot.gap{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.slot.gap .st{color:var(--brand);font-weight:700}
.slot.open .st,.slot.cover .st{color:var(--pending);font-weight:600}
.slot.rest .nm,.slot.none .nm{color:var(--ink-faint)}
.empty,.foot{color:var(--ink-faint);font-size:14px;text-align:center;margin-top:24px}
.toast{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);border-radius:12px;padding:12px 14px;font-size:15px;text-align:center}
.action{display:inline-flex;align-items:center;min-height:44px;padding:4px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--brand);font:600 14px var(--sans);text-decoration:none;cursor:pointer}
.person{padding:14px;margin-top:10px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.person p strong{display:block;color:var(--ink);font-weight:600}.relief-group>h2{margin:20px 0 8px}#operatorTitle{margin:0;padding:0;border:0}.person h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.person p,.hint{margin:6px 0;font-size:14px;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chiptype{display:inline-block;font-size:12px;font-weight:600;line-height:18px;padding:0 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink);white-space:nowrap}
.chiptype.unknown{color:var(--ink-faint);font-weight:400}
.slot{align-items:center}
.tc{width:84px}.tc .chiptype{display:block;width:max-content;margin-top:2px}
.nm summary{list-style:none;cursor:pointer;font-weight:600}.nm summary::-webkit-details-marker{display:none}
.nm summary small{color:var(--ink-faint);font-weight:400;margin-left:6px}
.detail{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:4px}
.call{flex:none;min-width:48px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--brand);font:600 14px var(--sans);text-decoration:none}
.who{color:var(--ink)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.line .state{margin:0}
.need{margin-top:3px;font-size:14px;color:var(--ink-soft)}
</style>
</head>

<script>
(function(){
const $ = id => document.getElementById(id);
const KEY = 'jiaan-leave-key';
const store = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}}, set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let data = null;

async function open(pass){
  const pack = await (await fetch('data.json?t=' + Date.now(), {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:bytes(pack.salt), iterations:pack.iter}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(pack.iv)}, key, bytes(pack.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function el(tag, cls, text){const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n;}
const sg = () => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Singapore'}).format(new Date());
const plus = (iso,n) => {const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);};
function dayName(iso){
  const d = new Date(iso+'T00:00:00Z'), t = sg();
  const head = iso===t ? '今天 ' : iso===plus(t,1) ? '明天 ' : '';
  const year = iso.slice(0,4)!==t.slice(0,4) ? iso.slice(0,4)+'年' : '';
  return `${head}${year}${d.getUTCMonth()+1}月${d.getUTCDate()}日 周${'日一二三四五六'[d.getUTCDay()]}`;
}
let toastTimer;
function toast(t){$('toast').textContent=t; $('toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').hidden=true, 3500);}
async function report(r){
  const text = `【顶班】${dayName(r.date).replace(/^(今天|明天) /,'')} ${r.site} ${r.tc}（${r.who} 休）\n顶班人：`;
  try{ await navigator.clipboard.writeText(text); toast('已复制顶班信息'); }
  catch(e){ prompt('复制顶班信息', text); }
}
function action(label, run){
  const b = el('button','action',label); b.type = 'button'; b.onclick = run; return b;
}
function chip(text){ return el('span', 'chiptype' + (text.includes('待核') ? ' unknown' : ''), text); }
function callButton(phone){
  const a = el('a','call','打电话'); a.href = 'tel:' + phone.replace(/[^\d+]/g,''); return a;
}
const info = name => (data.people || {})[name] || {full:'', types:[], certificates:[]};
const pretty = phone => phone.replace(/^\+65(\d{4})(\d{4})$/, '+65 $1 $2');
function details(name, phone, note){
  const p = info(name), d = el('details'), s = el('summary','',name);
  if(note) s.append(el('small','',note));
  d.append(s);
  const lines = [p.full && '全名：' + p.full, phone && '手机：' + pretty(phone),
                 p.types.length ? '能开：' + p.types.join('、') : '能开机型：未登记', ...p.certificates];
  for(const line of lines.filter(Boolean)) d.append(el('div','detail',line));
  return d;
}
function card(r, past){
  const c = el('div', 'card' + (r.rep || past ? '' : ' gap')), b = el('div','body');
  b.append(el('div','where', `${r.site} ${r.tc}`.trim()));
  const need = el('div','need','机位要求：'); need.append(chip(r.crane));
  b.append(need);
  const who = el('div','who', `${r.who} 休假${r.part ? '（'+r.part+'）' : ''}`);
  if(r.pending) who.append(el('span','tag','请假待确认'));
  b.append(who);
  const line = el('div','line');
  line.append(el('div','state', r.rep ? `${r.rep} 顶班` : past ? '没记顶班' : '待替班'));
  if(r.rep && r.rep_phone && !past) line.append(callButton(r.rep_phone));
  b.append(line);
  if(!past && !r.rep){
    const actions = el('div','actions');
    actions.append(action('找能顶的司机', () => findRelief(r.crane)), action('复制顶班信息', () => report(r)));
    if(r.who_phone) actions.append(Object.assign(callButton(r.who_phone), {textContent:'打给' + r.who}));
    b.append(actions);
  }
  c.append(b);
  return c;
}
function findRelief(crane){
  switchTab('operators');
  kind = crane.startsWith('平桥') ? '平桥' : crane.startsWith('上下桥') ? '上下桥' : '';
  draw();
}
const LABEL = {ok:'', cover:'顶班', gap:'待替班', open:'没排人', rest:'休', none:'无人'};
const TABS = {tToday:'today', tGap:'gap', tLeave:'leave', tOperators:'operators'};
let tab = 'today', past = false, dayAt = null, kind = '';
const match = (q, ...parts) => q.split(/\s+/).every(word => parts.join(' ').toLowerCase().includes(word));
function switchTab(next){
  if(tab !== next) $('q').value = '';
  tab = next;
  dayAt = null;
  kind = '';
  window.scrollTo(0, 0);
  draw();
}
function drawOperators(list, q){
  const found = (data.operators || []).filter(p => match(q, p.name, p.note, p.area, ...p.types, ...p.certificates));
  const order = (a,b) => (!!b.phone - !!a.phone) || (b.types.length - a.types.length) || a.name.localeCompare(b.name);
  const sure = found.filter(p => !kind || p.types.includes(kind)).sort(order);
  const unsure = kind ? found.filter(p => !p.types.length).sort(order) : [];
  const people = [...sure, ...unsure];
  if(kind && !sure.length) list.append(el('p','empty', `没有登记能开${kind}的替班司机。`));
  for(const p of people){
    if(kind && p === unsure[0]) list.append(el('h2','', `下面 ${unsure.length} 人机型没登记，打电话确认`));
    const box = el('article','person'), line = el('div','line');
    line.append(el('h3','',p.name));
    if(p.phone) line.append(callButton(p.phone));
    box.append(line);
    const tags = el('p');
    if(p.types.length) for(const k of p.types){ tags.append(chip(k), ' '); } else tags.append(chip('机型待核'));
    tags.append(` ${p.area || '区域未登记'}`);
    box.append(tags);
    const d = el('details'); d.append(el('summary','hint','详情'));
    for(const x of [p.note, p.phone && '手机：' + pretty(p.phone), ...p.certificates].filter(Boolean)) d.append(el('div','detail',x));
    box.append(d);
    list.append(box);
  }
  if(!people.length && !kind) list.append(el('p','empty', q || kind ? '没有找到符合条件的司机。' : '暂无替班司机记录。'));
}
function grouped(list, rows, make, headNote){
  let last = '';
  for(const r of rows){
    if(r.date !== last){ last = r.date; const h = el('h2','',dayName(r.date)); if(headNote) h.append(el('span','',headNote(r.date))); list.append(h); }
    list.append(make(r));
  }
}
function slotRow(x){
  const row = el('div','slot ' + x.state), tc = el('div','tc', `${x.tc}${x.shift ? ' '+x.shift : ''}`);
  tc.append(chip(x.crane));
  const nm = el('div','nm');
  if(x.name) nm.append(details(x.name, x.phone, x.note));
  else nm.textContent = x.state==='none' ? '—' : x.state==='open' ? '？' : '';
  row.append(tc, nm);
  if(LABEL[x.state]) row.append(el('span','st', LABEL[x.state]));
  if(x.phone && (x.state==='ok' || x.state==='cover')) row.append(callButton(x.phone));
  return row;
}
function openSlots(day){
  const d = data.schedule.find(x => x.date === day);
  return d ? d.sites.flatMap(s => s.slots.filter(x => x.state==='open').map(x => ({site:s.site, ...x}))) : [];
}
function drawToday(list, q){
  const days = data.schedule.filter(d => d.date >= sg());
  if(!days.length){ list.append(el('p','empty','今天以后还没有排班记录。')); $('day').textContent=''; return; }
  let i = days.findIndex(d => d.date === dayAt); if(i < 0) i = 0;
  const d = days[i]; dayAt = d.date;
  $('day').textContent = dayName(d.date);
  $('prev').disabled = i === 0; $('next').disabled = i === days.length - 1;
  $('prev').onclick = () => { dayAt = days[i-1].date; draw(); };
  $('next').onclick = () => { dayAt = days[i+1].date; draw(); };
  if(d.date !== sg() && i === 0) list.append(el('p','empty','今天还没有排班记录，下面是最近的一天。'));
  let shown = 0;
  for(const s of d.sites){
    const slots = s.slots.filter(x => match(q, s.site, x.tc, x.name, x.note));
    if(!slots.length) continue;
    shown++;
    const box = el('section','site'), h = el('h3','',s.site), n = slots.filter(x=>x.state==='gap').length;
    h.append(el('span','', s.rest ? '工地休' : n ? `待替班 ${n}` : ''));
    box.append(h);
    for(const x of slots) box.append(slotRow(x));
    list.append(box);
  }
  if(!shown) list.append(el('p','empty','没找到。'));
}
function draw(){
  const today = sg(), q = $('q').value.trim().toLowerCase();
  const tomorrow = plus(today,1);
  const future = data.rows.filter(r => r.date >= today);
  const gapRows = future.filter(r => r.date <= tomorrow && !r.rep);
  const gaps = d => gapRows.filter(r => r.date===d).length;
  const word = n => n ? `缺 ${n} 人` : '不缺人';
  const summary = (label, d) => {
    const p = el('p','', label), open = openSlots(d).length;
    p.append(el('b','', gaps(d) ? `待替班 ${gaps(d)}` : '休假都有人顶'), open ? `，没排人 ${open}` : '');
    return p;
  };
  $('sub').replaceChildren(summary('今天：', today), summary('明天：', tomorrow), el('p','updated', `更新于 ${data.updated}`));
  $('nGap').textContent = gapRows.length;
  $('nGap').hidden = !gapRows.length;
  for(const [id,name] of Object.entries(TABS)) $(id).setAttribute('aria-pressed', tab===name);
  $('daybar').hidden = tab !== 'today'; $('when').hidden = tab !== 'leave';
  $('kind').hidden = tab !== 'operators';
  for(const [id,value] of [['kAll',''],['kFlat','平桥'],['kLuff','上下桥']]) $(id).setAttribute('aria-pressed', kind===value);
  const prompt = tab === 'operators' ? '搜姓名或区域' : '搜工地、塔吊或名字';
  $('q').placeholder = prompt + '…';
  $('q').setAttribute('aria-label', prompt);
  $('wNext').setAttribute('aria-pressed', !past); $('wPast').setAttribute('aria-pressed', past);
  $('foot').hidden = false;
  $('foot').textContent = tab === 'operators' ? '派工前请核对证件类别及有效期。' : '这是计划排班。机型带「推定」的，派工前先确认。';
  const list = $('list'); list.replaceChildren();
  if(tab === 'today'){ drawToday(list, q); return; }
  if(tab === 'operators'){ drawOperators(list, q); return; }
  const source = tab === 'gap' ? gapRows : past ? data.past.filter(r => r.date < today) : future;
  const rows = source.filter(r => match(q, r.site, r.tc, r.crane, r.who, r.rep));
  const old = tab === 'leave' && past;
  grouped(list, rows, r => card(r, old), tab === 'gap' ? d => word(gaps(d)) : null);
  if(!rows.length) list.append(el('p','empty', q ? '没找到。' : tab==='gap' ? '今天和明天的休假都有人顶。' : '没有记录。'));
  if(tab === 'gap'){
    for(const d of [today, tomorrow]){
      const open = openSlots(d).filter(x => match(q, x.site, x.tc, x.crane));
      if(!open.length) continue;
      list.append(el('h2','', `${dayName(d)} 没排人 ${open.length}`));
      for(const s of [...new Set(open.map(x => x.site))]){
        const box = el('section','site'); box.append(el('h3','',s));
        for(const x of open.filter(y => y.site===s)) box.append(slotRow(x));
        list.append(box);
      }
    }
  }
}
function key(){
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  return m ? m[1] : store.get();
}
async function load(){
  const k = key();
  if(!k){ $('sub').textContent = '请用群里发的完整链接打开。'; return; }
  try{ data = await open(k); }
  catch(e){ $('app').hidden = true; $('sub').textContent = e.name==='OperationError' ? '这个链接已经失效，请要一个新链接。' : '打不开，请检查网络后再试。'; return; }
  store.set(k); $('app').hidden = false; draw();
}
for(const [id,next] of Object.entries(TABS)) $(id).onclick = () => switchTab(next);
for(const [id,value] of [['kAll',''],['kFlat','平桥'],['kLuff','上下桥']]) $(id).onclick = () => { kind = value; draw(); };
$('wNext').onclick = () => { past = false; draw(); };
$('wPast').onclick = () => { past = true; draw(); };
$('q').oninput = () => draw();
window.addEventListener('hashchange', load);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
load();
})();
</script>
</body>
</html>
